[extend]
useDefault = true

[[rules]]
id = "firebase-client-config-key"
description = "Real client API keys are local configuration, never public source."
regex = '''AIza[0-9A-Za-z_-]{35}'''

[[allowlists]]
description = "Exact historical APK checksum, not an API credential."
condition = "AND"
regexTarget = "secret"
paths = ['^docs/PRD\.md$']
regexes = ['^908ecaa06845a02f23b2cdc3f8f94f1b5f141000782b2120aad3a845ef6de47d$']

[[allowlists]]
description = "Reviewed CocoaPods React-cxxstableapi specification checksum."
condition = "AND"
regexTarget = "secret"
paths = ['^ios/Podfile\.lock$']
regexes = ['^9729effdd0475c76a2e3191caa1c2b1da7f1fb49$']
