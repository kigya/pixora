apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"
apply plugin: "jacoco"
jacoco { toolVersion = "0.8.14" }

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    if (project.hasProperty('firebaseDiagnostics')) {
        entryFile = file('../../index.diagnostics.js')
    }
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def signingProperties = new Properties()
def signingFile = rootProject.file("signing.properties")
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }
def hasLocalSigning = signingFile.exists() && !project.hasProperty("ci")

def feedbackProperties = new Properties()
def feedbackFile = rootProject.file("feedback.properties")
if (feedbackFile.exists()) feedbackFile.withInputStream { feedbackProperties.load(it) }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "dev.kigya.pixora"
    testBuildType project.hasProperty("scrollBenchmark") ? "benchmark" : (project.hasProperty("coverage") ? "coverage" : "release")
    testOptions { unitTests.includeAndroidResources = true }
    if (project.hasProperty('firebaseDiagnostics')) {
        sourceSets {
            diagnosticsDebug {
                java.srcDir 'src/diagnostics/java'
                manifest.srcFile 'src/diagnostics/AndroidManifest.xml'
            }
        }
    }
    defaultConfig {
        applicationId "dev.kigya.pixora"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        externalNativeBuild { cmake { arguments "-DFEEDBACK_GENERATED_DIR=${layout.buildDirectory.dir('generated/feedback').get().asFile}", "-DANDROID_STL=c++_shared", "-DUPSCALE_COVERAGE=${project.hasProperty('coverage') ? 'ON' : 'OFF'}" } }
        buildConfigField "boolean", "FAST_MODEL_ENABLED", (project.findProperty("fastModeEnabled") ?: "true")
        versionCode 10
        versionName "0.8.0"
    }
    externalNativeBuild { cmake { path "src/main/cpp/CMakeLists.txt"; version "3.22.1" } }
    androidResources { noCompress += ["bin", "param"] }
    signingConfigs {
        release {
            if (hasLocalSigning) {
                storeFile rootProject.file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            buildConfigField "boolean", "TELEMETRY_DEFAULT", "false"
            signingConfig signingConfigs.debug
        }
        release {
            shrinkResources false
            buildConfigField "boolean", "TELEMETRY_DEFAULT", "false"
            firebaseCrashlytics {
                mappingFileUploadEnabled !project.hasProperty("ci")
                nativeSymbolUploadEnabled !project.hasProperty("ci")
                unstrippedNativeLibsDir file("build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib")
            }
            ndk { debugSymbolLevel "FULL" }
            enableAndroidTestCoverage project.hasProperty("coverage")
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            // CI validates release compilation without access to production credentials.
            if (project.hasProperty("localTestSigning")) signingConfig signingConfigs.debug
            else if (hasLocalSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        coverage {
            initWith release
            signingConfig signingConfigs.debug
            debuggable false
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo" } }
            minifyEnabled false
            shrinkResources false
            matchingFallbacks = ['release']
            enableAndroidTestCoverage true
            buildConfigField "boolean", "TELEMETRY_DEFAULT", "false"
            firebaseCrashlytics { mappingFileUploadEnabled false; nativeSymbolUploadEnabled false }
        }
        if (project.hasProperty('firebaseDiagnostics')) {
            diagnostics {
                initWith release
                matchingFallbacks = ['release']
                debuggable false
                enableAndroidTestCoverage false
                buildConfigField "boolean", "TELEMETRY_DEFAULT", "false"
                externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=RelWithDebInfo", "-DPIXORA_FIREBASE_DIAGNOSTICS=ON" } }
                firebaseCrashlytics {
                    mappingFileUploadEnabled true
                    nativeSymbolUploadEnabled true
                    unstrippedNativeLibsDir file("build/intermediates/merged_native_libs/diagnostics/mergeDiagnosticsNativeLibs/out/lib")
                }
            }
            diagnosticsDebug {
                initWith debug
                matchingFallbacks = ['debug']
                enableAndroidTestCoverage false
                // Fabric props must use the same debug ABI as the debug React Native AAR.
                externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Debug", "-DPIXORA_FIREBASE_DIAGNOSTICS=ON" } }
                firebaseCrashlytics {
                    mappingFileUploadEnabled false
                    nativeSymbolUploadEnabled true
                    unstrippedNativeLibsDir file("build/intermediates/merged_native_libs/diagnosticsDebug/mergeDiagnosticsDebugNativeLibs/out/lib")
                }
            }
        }
        if (project.hasProperty('scrollBenchmark')) {
            benchmark {
                initWith release
                matchingFallbacks = ['release']
                minifyEnabled false
                shrinkResources false
                enableAndroidTestCoverage false
                buildConfigField "boolean", "TELEMETRY_DEFAULT", "false"
                firebaseCrashlytics { mappingFileUploadEnabled false; nativeSymbolUploadEnabled false }
            }
        }
    }
}

dependencies {
    implementation(platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseBomVersion}"))
    implementation("com.google.firebase:firebase-analytics")
    implementation("com.google.firebase:firebase-config")
    implementation("com.google.firebase:firebase-crashlytics-ndk")
    implementation("com.google.android.play:review:2.0.2")
    implementation("androidx.window:window:1.5.1")
    implementation("androidx.window:window-java:1.5.1")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.exifinterface:exifinterface:1.4.2")
    implementation("androidx.activity:activity-ktx:1.12.4")
    testImplementation("junit:junit:4.13.2")
    testImplementation("org.robolectric:robolectric:4.16.1")
    testImplementation("org.mockito:mockito-core:5.20.0")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// The same validated dictionaries serve React Native and Android notifications.
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/localizationAssets").get().asFile)
tasks.register("syncLocalization", Copy) {
    dependsOn("verifyLocalization")
    from("../../src/locales")
    into(layout.buildDirectory.dir("generated/localizationAssets/locales"))
}
tasks.register("verifyLocalization", Exec) {
    workingDir(rootProject.projectDir.parentFile)
    commandLine("python3", "scripts/verify-locales.py")
}
tasks.named("preBuild").configure { dependsOn("syncLocalization") }

// Explicit own-code denominator. Generated RN specs, resources and dependencies
// are excluded; all application Kotlin classes remain in the report.
tasks.register("nativeJvmCoverage", JacocoReport) {
    dependsOn("testCoverageUnitTest")
    executionData(files(layout.buildDirectory.file("jacoco/testCoverageUnitTest.exec")))
    executionData(fileTree(layout.buildDirectory.dir("outputs/code_coverage/coverageAndroidTest/connected")) { include "**/*.ec" })
    sourceDirectories.from(files("src/main/java"))
    classDirectories.from(fileTree(layout.buildDirectory.dir("tmp/kotlin-classes/coverage")) {
        include "dev/kigya/pixora/**"
        exclude "**/BuildConfig*", "**/R.class", "**/R\$*.class"
    })
    reports { xml.required = true; html.required = true }
}

tasks.withType(Test).configureEach {
    jacoco { includeNoLocationClasses = true; excludes = ["jdk.internal.*"] }
}

// Private local input becomes encoded native data, never a BuildConfig/JS string.
tasks.register("encodeFeedbackEndpoint", Exec) {
    // Optional means the property may be absent, not that a declared file may be missing.
    // Public CI intentionally has no private feedback.properties.
    inputs.files(providers.provider {
        def source = rootProject.file("feedback.properties")
        source.exists() ? [source] : []
    })
    outputs.file(layout.buildDirectory.file("generated/feedback/feedback_endpoint.h"))
    commandLine("python3", "../../scripts/encode-feedback-endpoint.py", rootProject.file("feedback.properties"), layout.buildDirectory.file("generated/feedback/feedback_endpoint.h").get().asFile)
}
tasks.named("preBuild").configure { dependsOn("encodeFeedbackEndpoint") }

// Symbol extraction must consume the matching variant's unstripped merged libraries.
// The diagnostic debug build uses the same registered Firebase client as normal debug.
if (project.hasProperty('firebaseDiagnostics')) {
    gradle.projectsEvaluated {
        tasks.named('processDiagnosticsDebugGoogleServices').configure {
            googleServicesJsonFiles.set([file('src/debug/google-services.json')])
        }
    }
    gradle.taskGraph.whenReady { graph ->
        def ordinaryPackage = graph.allTasks.find {
            it.project == project && it.name ==~ /package(Debug|Release|Coverage|Benchmark)(Bundle)?/
        }
        if (ordinaryPackage != null) {
            throw new GradleException('firebaseDiagnostics may only package diagnostics variants; remove the property for normal APK/AAB builds.')
        }
    }
}
// Explicit task dependency avoids Gradle ordering ambiguity and other variant build IDs.
tasks.matching { it.name in ['generateCrashlyticsSymbolFileRelease', 'generateCrashlyticsSymbolFileDiagnostics', 'generateCrashlyticsSymbolFileDiagnosticsDebug'] }.configureEach {
    dependsOn(name.replace('generateCrashlyticsSymbolFile', 'merge') + 'NativeLibs')
}

// JVM tests execute the Kotlin JNI forwarding boundary using a test-only host library.
// Real ncnn inference remains covered separately on the physical device and in native tests.
def nativeJvmFixtureDirectory = layout.buildDirectory.dir("nativeJvmFixture")
def hostIsMac = System.getProperty("os.name").toLowerCase(java.util.Locale.ROOT).contains("mac")
def nativeJvmFixtureLibrary = nativeJvmFixtureDirectory.map { it.file(hostIsMac ? "libupscale.dylib" : "libupscale.so") }
tasks.register("compileNativeJvmFixture", Exec) {
    inputs.file(rootProject.file("../tests/native/android_jvm_fixture.cpp"))
    outputs.file(nativeJvmFixtureLibrary)
    doFirst { nativeJvmFixtureDirectory.get().asFile.mkdirs() }
    def javaIncludes = new File(System.getProperty("java.home"), "include")
    commandLine("c++", "-std=c++17", "-fPIC", hostIsMac ? "-dynamiclib" : "-shared",
        "-I${javaIncludes}", "-I${new File(javaIncludes, hostIsMac ? 'darwin' : 'linux')}",
        rootProject.file("../tests/native/android_jvm_fixture.cpp"), "-o", nativeJvmFixtureLibrary.get().asFile)
}
tasks.matching { it.name == "testCoverageUnitTest" }.configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    dependsOn("compileNativeJvmFixture")
    systemProperty("java.library.path", nativeJvmFixtureDirectory.get().asFile.absolutePath)
    // Robolectric sandboxes use distinct classloaders; JNI libraries are process-owned.
    // Give each test class its own JVM rather than suppressing the production load boundary.
    forkEvery = 1
}

// React Native's callback class loads fbjni during class initialization; callback execution is mocked.
def nativeJvmLoaderLibrary = nativeJvmFixtureDirectory.map { it.file(hostIsMac ? "libfbjni.dylib" : "libfbjni.so") }
tasks.register("compileNativeJvmLoaderFixture", Exec) {
    inputs.file(rootProject.file("../tests/native/android_jvm_loader_fixture.cpp"))
    outputs.file(nativeJvmLoaderLibrary)
    doFirst { nativeJvmFixtureDirectory.get().asFile.mkdirs() }
    commandLine("c++", "-std=c++17", "-fPIC", hostIsMac ? "-dynamiclib" : "-shared",
        rootProject.file("../tests/native/android_jvm_loader_fixture.cpp"), "-o", nativeJvmLoaderLibrary.get().asFile)
}
tasks.matching { it.name == "testCoverageUnitTest" }.configureEach {
    dependsOn("compileNativeJvmLoaderFixture")
}
