name: Verify main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-main-${{ github.ref }}
  cancel-in-progress: false

env:
  PIXORA_CI: '1'
  NODE_VERSION: '22.23.2'
  JAVA_VERSION: '21.0.12.1+1'
  PYTHON_VERSION: '3.14.7'
  SEMGREP_SEND_METRICS: 'off'
  SEMGREP_ENABLE_VERSION_CHECK: '0'

jobs:
  javascript-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --runInBand --coverage
      - run: python3 scripts/check-js-coverage.py
      - run: python3 scripts/verify-assets.py
      - run: python3 scripts/verify-locales.py
      - run: node --test support/apps-script/feedback.test.cjs
      - name: Publication policy and strict tooling coverage
        run: |
          mkdir -p coverage
          export COVERAGE_FILE=coverage/publication
          python3 -m venv .p-build-app/local/publication-python
          .p-build-app/local/publication-python/bin/pip install --require-hashes -r scripts/publication-requirements.txt
          .p-build-app/local/publication-python/bin/coverage run --branch --include=scripts/check-publication.py,scripts/prepare-ci-firebase.py -m unittest discover -s tests/publication -v
          .p-build-app/local/publication-python/bin/coverage report --fail-under=100
          python3 scripts/check-publication.py --history HEAD
      - run: python3 scripts/setup-security-tools.py
      - name: Secret and workflow scans
        run: |
          .p-build-app/local/bin/gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null
          .p-build-app/local/bin/actionlint
          .p-build-app/local/bin/zizmor --offline .github/workflows/main.yml
      - name: Dependency audits
        run: |
          .p-build-app/local/bin/osv-scanner scan source --lockfile=package-lock.json --lockfile=Gemfile.lock --format=json --output-file=coverage/osv.json
          .p-build-app/local/bin/osv-scanner scan source --config=scripts/osv-tooling.toml --lockfile=scripts/security-requirements.txt --lockfile=scripts/publication-requirements.txt --format=json --output-file=coverage/osv-tooling.json
          mkdir -p .p-build-app/local/native-locks
          cp ios/Podfile.lock scripts/ios-project/Package.resolved .p-build-app/local/native-locks/
          .p-build-app/local/bin/trivy fs --scanners vuln --format json --output coverage/native-dependencies.json --cache-dir .p-build-app/local/trivy-cache --exit-code 1 .p-build-app/local/native-locks
      - name: Mobile source scan
        run: |
          python3 -m venv .p-build-app/local/security-python
          .p-build-app/local/security-python/bin/pip install --require-hashes -r scripts/security-requirements.txt
          export PATH="$PWD/.p-build-app/local/security-python/bin:$PATH"
          mobsfscan --type ios --json -o coverage/mobile-ios.json ios/Native ios/Pixora
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - run: npm ci --legacy-peer-deps
      - run: python3 scripts/setup-ncnn.py
      - name: Kotlin tests and native JVM coverage
        working-directory: android
        run: ./gradlew :app:testCoverageUnitTest :app:nativeJvmCoverage -Pcoverage -Pci --console=plain
      - run: python3 scripts/check-native-coverage.py --kotlin android/app/build/reports/jacoco/nativeJvmCoverage/nativeJvmCoverage.xml --kotlin-source-dir android/app/src/main/java
      - name: Release-mode build without production credentials
        working-directory: android
        run: ./gradlew :app:assembleRelease :app:bundleRelease -Pci --console=plain
      - name: Android source and resolved release-manifest scan
        run: |
          python3 -m venv .p-build-app/local/security-python
          .p-build-app/local/security-python/bin/pip install --require-hashes -r scripts/security-requirements.txt
          export PATH="$PWD/.p-build-app/local/security-python/bin:$PATH"
          mkdir -p coverage
          mobsfscan --type android --json -o coverage/mobile-android.json android/app/src/main/java android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
  native-cpp-codeql:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          languages: cpp
          build-mode: manual
      - run: bash scripts/test-native-core.sh
      - run: bash scripts/test-recommendation-core.sh
      - run: bash scripts/test-recommendation-jni.sh
      - name: Compile remaining JNI and Android C++ translation units for extraction
        run: |
          mkdir -p .p-build-app/local/native-codeql
          for source in \
            android/app/src/main/cpp/engine/pixels.cpp \
            android/app/src/diagnostics/cpp/crash.cpp \
            tests/native/android_jvm_fixture.cpp \
            tests/native/android_jvm_loader_fixture.cpp; do
            object=".p-build-app/local/native-codeql/$(basename "${source%.cpp}").o"
            xcrun clang++ -std=c++17 -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
              -c "$source" -o "$object"
          done
      - name: Enforce the owned C++ denominator
        run: >-
          python3 scripts/check-native-coverage.py
          --llvm coverage/native-core/coverage.json
          --llvm coverage/recommendation/coverage.json
          --llvm coverage/recommendation-jni/coverage.json
          --source-dir native/engine --source-dir native/recommendation
          --require-source native/recreate/recreate.cpp
          --require-source android/app/src/main/cpp/engine/recreate_jni.cpp
          --require-source android/app/src/main/cpp/engine/upscale.cpp
          --require-source android/app/src/main/cpp/engine/raster_jni.cpp
          --require-source android/app/src/main/cpp/engine/recommendation_jni.cpp
      # CodeQL supports C/C++; Objective-C++ iOS sources remain in the iOS mobile source scan.
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
  ios-device-release:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - run: npm ci --legacy-peer-deps
      - name: Build unsigned generic-device iOS Release
        run: bash scripts/build-ios.sh
  ios-simulator-tests:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
      - run: npm ci --legacy-peer-deps
      - name: Run simulator XCTest and produce strict iOS coverage
        run: bash scripts/test-ios.sh
      - name: Enforce the owned iOS source denominator
        run: >-
          python3 scripts/check-native-coverage.py
          --llvm coverage/ios/coverage.json
          --source-dir ios/Native --source-dir ios/Pixora
          --require-source ios/Pixora/AppDelegate.swift
